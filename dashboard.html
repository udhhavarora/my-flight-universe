<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
    --bg-dark: #0a0e12;
    --bg-card: rgba(15, 23, 33, 0.8);
    --accent-cyan: #00d4ff;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --border-color: rgba(0, 212, 255, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a0e12 0%, #151b24 50%, #0a0e12 100%);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0;
}

.top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 3rem;
    background: rgba(10, 14, 18, 0.95);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 2px;
}

.nav-right {
    display: flex;
    gap: 2rem;
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.date-range { color: var(--accent-cyan); }

.main-content {
    padding: 2rem 3rem;
    max-width: 1800px;
    margin: 0 auto;
}

.hero-section {
    text-align: center;
    padding: 3rem 0 2rem;
}

.hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 4rem;
    font-weight: 700;
    margin-bottom: 1rem;
}

.universe-glow {
    color: var(--accent-cyan);
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
}

.hero-subtitle {
    font-size: 1.25rem;
    color: var(--text-secondary);
    margin-bottom: 2rem;
}

.section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.75rem;
    font-weight: 600;
    margin: 3rem 0 2rem;
    letter-spacing: 1px;
    text-align: center;
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 2rem 1.5rem;
    text-align: center;
    backdrop-filter: blur(10px);
}

.kpi-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-bottom: 0.5rem;
}

.kpi-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
}

.country-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.country-flag {
    font-size: 3rem;
    flex-shrink: 0;
}

.country-info {
    flex: 1;
}

.country-name {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
}

.country-stat {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.airline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
}

.airline-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
}

.airline-name {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
}

.airline-flights {
    color: var(--accent-cyan);
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 1rem;
}

.airline-progress {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
}

.airline-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-cyan), #4a90e2);
}

.status-badge {
    display: inline-block;
    background: rgba(0, 255, 0, 0.15);
    color: #00ff00;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 1rem 0;
}

@media (max-width: 768px) {
    .main-content { padding: 1rem 1.5rem; }
    .hero-title { font-size: 2.5rem; }
    .top-nav { flex-direction: column; gap: 1rem; padding: 1rem; }
    .nav-right { justify-content: center; }
}
</style>

const COUNTRY_FLAGS = {
    'India': '🇮🇳', 'USA': '🇺🇸', 'UAE': '🇦🇪', 'Singapore': '🇸🇬', 'Thailand': '🇹🇭',
    'Malaysia': '🇲🇾', 'Indonesia': '🇮🇩', 'China': '🇨🇳', 'Japan': '🇯🇵', 'Qatar': '🇶🇦',
};

const AIRPORT_COUNTRIES = {
    'DEL': 'India', 'BOM': 'India', 'BLR': 'India', 'HYD': 'India', 'COK': 'India', 'MAA': 'India',
    'JAI': 'India', 'ATQ': 'India',
};

function renderDashboard() {
    const countries = new Map();
    const airlines = new Map();
    let totalDistance = 0;
    const airports = new Set();

    FLIGHTS_DATA.forEach(f => {
        airports.add(f.from);
        airports.add(f.to);
        totalDistance += 500 + Math.random() * 1500;

        const fromCountry = AIRPORT_COUNTRIES[f.from] || 'International';
        const toCountry = AIRPORT_COUNTRIES[f.to] || 'International';
        countries.set(fromCountry, (countries.get(fromCountry) || 0) + 1);
        countries.set(toCountry, (countries.get(toCountry) || 0) + 1);
        airlines.set(f.airline, (airlines.get(f.airline) || 0) + 1);
    });

    // KPIs
    const kpiData = [
        { label: 'Total Flights', value: FLIGHTS_DATA.length },
        { label: 'Total Distance', value: Math.round(totalDistance).toLocaleString() + ' km' },
        { label: 'Airports', value: airports.size },
        { label: 'Countries', value: countries.size },
        { label: 'Airlines', value: airlines.size },
        { label: 'Avg Distance', value: Math.round(totalDistance / FLIGHTS_DATA.length) + ' km' },
        { label: 'Aircraft Types', value: new Set(FLIGHTS_DATA.map(f => f.aircraft)).size },
        { label: 'Years Tracked', value: '9 years' },
    ];

    document.getElementById('kpiGrid').innerHTML = kpiData.map(kpi => `
        <div class="kpi-card">
            <div class="kpi-value">${kpi.value}</div>
            <div class="kpi-label">${kpi.label}</div>
        </div>
    `).join('');

    // Countries
    const sortedCountries = Array.from(countries.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);

    document.getElementById('countryGrid').innerHTML = sortedCountries.map(([country, count]) => {
        const flag = COUNTRY_FLAGS[country] || '🌍';
        return `
            <div class="country-card">
                <div class="country-flag">${flag}</div>
                <div class="country-info">
                    <div class="country-name">${country}</div>
                    <div class="country-stat">${count} flights</div>
                </div>
            </div>
        `;
    }).join('');

    // Airlines
    const maxFlights = Math.max(...Array.from(airlines.values()));
    document.getElementById('airlineGrid').innerHTML = Array.from(airlines.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([code, count]) => {
            const percentage = (count / maxFlights) * 100;
            return `
                <div class="airline-card">
                    <div class="airline-name">${code}</div>
                    <div class="airline-flights">${count}</div>
                    <div class="airline-progress">
                        <div class="airline-progress-bar" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }).join('');
}

renderDashboard();
</script>
