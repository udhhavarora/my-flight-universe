<title>My Flight Universe</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #0a0e12;
    --bg-card: rgba(15, 23, 33, 0.8);
    --accent-cyan: #00d4ff;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-muted: rgba(255, 255, 255, 0.5);
    --border-color: rgba(0, 212, 255, 0.2);
}

@media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
        --bg-dark: #ffffff;
        --bg-card: rgba(240, 240, 240, 0.9);
        --accent-cyan: #0088cc;
        --text-primary: #1a1a1a;
        --text-secondary: rgba(0, 0, 0, 0.6);
        --text-muted: rgba(0, 0, 0, 0.45);
        --border-color: rgba(0, 0, 0, 0.15);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a0e12 0%, #151b24 50%, #0a0e12 100%);
    color: var(--text-primary);
    min-height: 100vh;
}

.top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 3rem;
    background: rgba(10, 14, 18, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 2px;
}

.nav-right {
    display: flex;
    gap: 2rem;
    align-items: center;
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.date-range { color: var(--accent-cyan); }

.main-content {
    padding: 2rem 3rem;
    max-width: 1800px;
    margin: 0 auto;
}

.hero-section {
    text-align: center;
    padding: 3rem 0 2rem;
}

.hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 4rem;
    font-weight: 700;
    margin-bottom: 1rem;
}

.universe-glow {
    color: var(--accent-cyan);
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
}

.hero-subtitle {
    font-size: 1.25rem;
    color: var(--text-secondary);
    margin-bottom: 3rem;
}

.globe-container {
    width: 100%;
    height: 600px;
    margin: 2rem auto;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(74, 144, 226, 0.08));
    display: flex;
    align-items: center;
    justify-content: center;
}

.globe-placeholder {
    text-align: center;
    color: rgba(0, 212, 255, 0.6);
}

.globe-placeholder-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.75rem;
    font-weight: 600;
    margin: 4rem 0 2rem;
    letter-spacing: 1px;
    text-align: center;
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
}

.kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 2rem 1.5rem;
    text-align: center;
    backdrop-filter: blur(10px);
}

.kpi-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-bottom: 0.5rem;
}

.kpi-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
}

.country-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.country-flag {
    font-size: 3rem;
    flex-shrink: 0;
}

.country-info {
    flex: 1;
}

.country-name {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
}

.country-stat {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.airline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
}

.airline-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
}

.airline-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
}

.airline-flights {
    color: var(--accent-cyan);
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 1rem;
}

.airline-progress {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
}

.airline-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-cyan), #4a90e2);
}

@media (max-width: 768px) {
    .top-nav { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
    .main-content { padding: 1rem 1.5rem; }
    .hero-title { font-size: 2.5rem; }
    .globe-container { height: 400px; }
    .kpi-grid, .country-grid, .airline-grid { grid-template-columns: 1fr; }
}
</style>

<div class="top-nav">
    <div class="nav-logo">MY FLIGHT UNIVERSE</div>
    <div class="nav-right">
        <span class="date-range" id="dateRange">2023</span>
        <span>FLIGHTY EXPORT</span>
    </div>
</div>

<main class="main-content">
    <section class="hero-section">
        <h1 class="hero-title">My Flight <span class="universe-glow">Universe</span></h1>
        <p class="hero-subtitle">A visual journal of the skies you've crossed.</p>
        <div class="globe-container">
            <div class="globe-placeholder">
                <div class="globe-placeholder-icon">🌍</div>
                <div style="font-size: 1.1rem; font-weight: 600;">Flight Routes Map</div>
                <div style="font-size: 0.9rem; margin-top: 0.5rem;" id="globeStats"></div>
            </div>
        </div>
    </section>

    <section>
        <h2 class="section-title">FLIGHT TELEMETRY</h2>
        <div class="kpi-grid" id="kpiGrid"></div>
    </section>

    <section>
        <h2 class="section-title">GEOGRAPHICAL STATS</h2>
        <div class="country-grid" id="countryGrid"></div>
    </section>

    <section>
        <h2 class="section-title">AIRLINE UNIVERSE</h2>
        <div class="airline-grid" id="airlineGrid"></div>
    </section>
</main>

    'PNQ': 'India', 'CCU': 'India', 'JAI': 'India', 'IXC': 'India', 'GOI': 'India',

    'BNE': 'Australia', 'PER': 'Australia', 'CGK': 'Indonesia'
};

function renderDashboard() {
    const countries = new Map();
    const airlines = new Map();
    let totalDistance = 0;
    let totalFlights = flights224.length;
    const airports = new Set();

    flights224.forEach(f => {
        airports.add(f.From);
        airports.add(f.To);
        totalDistance += f.Distance;

        const fromCountry = AIRPORT_COUNTRY[f.From] || 'Unknown';
        const toCountry = AIRPORT_COUNTRY[f.To] || 'Unknown';
        countries.set(fromCountry, (countries.get(fromCountry) || 0) + 1);
        countries.set(toCountry, (countries.get(toCountry) || 0) + 1);

        airlines.set(f.Airline, (airlines.get(f.Airline) || 0) + 1);
    });

    // Update KPIs
    const kpiData = [
        { label: 'Total Flights', value: totalFlights },
        { label: 'Total Distance', value: (totalDistance / 1000).toFixed(0) + 'k km' },
        { label: 'Airports Visited', value: airports.size },
        { label: 'Countries', value: countries.size },
        { label: 'Airlines', value: airlines.size },
        { label: 'Avg Distance', value: Math.round(totalDistance / totalFlights) + ' km' },
        { label: 'Longest Flight', value: Math.max(...flights224.map(f => f.Distance)) + ' km' },
        { label: 'Year', value: '2023' }
    ];

    document.getElementById('kpiGrid').innerHTML = kpiData.map(kpi => `
        <div class="kpi-card">
            <div class="kpi-value">${kpi.value}</div>
            <div class="kpi-label">${kpi.label}</div>
        </div>
    `).join('');

    // Update globe stats
    document.getElementById('globeStats').textContent = `${totalFlights} flights • ${airports.size} airports`;

    // Update countries - top 8
    const sortedCountries = Array.from(countries.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);

    document.getElementById('countryGrid').innerHTML = sortedCountries.map(([country, count]) => {
        const flag = COUNTRY_FLAGS[country] || '🌍';
        return `
            <div class="country-card">
                <div class="country-flag">${flag}</div>
                <div class="country-info">
                    <div class="country-name">${country}</div>
                    <div class="country-stat">${count} flights</div>
                </div>
            </div>
        `;
    }).join('');

    // Update airlines - top 8
    const maxFlights = Math.max(...Array.from(airlines.values()));
    document.getElementById('airlineGrid').innerHTML = Array.from(airlines.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([code, count]) => {
            const percentage = (count / maxFlights) * 100;
            return `
                <div class="airline-card">
                    <div class="airline-name">${code}</div>
                    <div class="airline-flights">${count} flights</div>
                    <div class="airline-progress">
                        <div class="airline-progress-bar" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }).join('');
}

renderDashboard();
</script>
